name: Bug report
description: Report a reproducible problem in VoiceShrink
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials, private recordings, and customer data before submitting.
  - type: input
    id: version
    attributes:
      label: VoiceShrink version
      placeholder: 0.2.6
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands and a minimal scenario with secrets removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste output from voiceshrink doctor --scenario <path> --json.
      render: json
